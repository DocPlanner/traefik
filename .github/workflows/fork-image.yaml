# Fork-only image build for running this performance stack at work.
# Builds a multi-arch (amd64 + arm64) Traefik image from this branch and pushes
# it to GHCR. Each architecture is built on its own native runner (no QEMU
# emulation), then merged into a single manifest list.
# This file lives only on docplanner/production-k8s-provider-perf and must never
# be part of an upstream PR.
name: Fork image

on:
  push:
    branches:
      - docplanner/production-k8s-provider-perf
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/docplanner/traefik

jobs:
  # The webui is architecture-independent, so build it once and share it.
  build-webui:
    # Never run on the upstream repository; this workflow is fork-specific.
    if: github.repository != 'traefik/traefik'
    uses: ./.github/workflows/template-webui.yaml

  build:
    needs: build-webui
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: '.go-version'
          check-latest: true

      - name: Artifact webui
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: webui.tar.gz

      - name: Untar webui
        run: |
          tar xvf webui.tar.gz
          rm webui.tar.gz

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The webui is already present (untarred above), so this only cross-compiles
      # the binary into dist/linux/<arch>/traefik for the root Dockerfile to copy.
      - name: Build binary (linux/${{ matrix.arch }})
        run: make binary-linux-${{ matrix.arch }}

      # Push by digest only; the merge job assembles the multi-arch tags.
      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${SHORT_SHA}" \
            --tag "${IMAGE}:perf-latest" \
            $(printf "${IMAGE}@sha256:%s " *)
          echo "Pushed ${IMAGE}:${SHORT_SHA} and ${IMAGE}:perf-latest"

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:perf-latest"
